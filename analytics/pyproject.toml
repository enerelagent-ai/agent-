[project]
name = "analytics"
version = "0.1.0"
description = "Shared duplicate-detection and market-calculation logic for the Ulaanbaatar real estate platform"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["analytics*"]
