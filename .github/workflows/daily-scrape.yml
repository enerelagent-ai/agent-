name: Daily scrape

# Replaces the local launchd job (scraper/bin/run_daily_scrape.sh) for the
# deployed setup -- same flags, same incremental-stop behavior, just running
# on GitHub's infra instead of a machine that has to stay awake with
# Postgres.app open (see CLAUDE.md's "Known issues" on that limitation).
on:
  schedule:
    # 03:00 Ulaanbaatar time (UTC+8) = 19:00 UTC the previous day.
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  group: unegui-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 180 was too tight during the current backfill period: Neon started
    # empty (Week 8 deploy), so most list pages still contain listings this
    # DB hasn't seen yet -- --stop-after-known-pages rarely triggers early,
    # unlike a caught-up steady state. Confirmed via a cancelled run's own
    # logs (2026-08-03): it was making steady progress, not stuck, but
    # needed to fetch 2,772 detail pages that day -- at the scraper's
    # deliberate ~4s/page rate limit (see scraper/scraper/main.py; not
    # something to speed up, it exists to respect the source site's load),
    # that's ~3.08h, just over the old 180min ceiling. 340 is comfortably
    # under GitHub Actions' hard 360min (6h) per-job limit for hosted
    # runners. Once Neon catches up to the site's full ~38k-listing
    # inventory, early-stop should trigger reliably again and runs should
    # drop back to the ~1h seen on lower-volume days -- this higher ceiling
    # just sits unused at that point, not a problem to revisit.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper + analytics
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright's browser
        working-directory: scraper
        run: playwright install --with-deps chromium

      - name: Run incremental scrape
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scraper.main \
            --pages 60 \
            --skip-recent-days 1 \
            --stop-after-known-pages 3
