name: Backfill all Unegui real-estate pages

on:
  workflow_dispatch: {}

# Shares the same lock with daily-scrape.yml and the one-range backfill.
# This guarantees Unegui sees only one real-estate crawler at a time.
concurrency:
  group: unegui-scraper
  cancel-in-progress: false

jobs:
  pages-061-070:
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 61, end_page: 70 }
    secrets: inherit
  pages-071-080:
    needs: pages-061-070
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 71, end_page: 80 }
    secrets: inherit
  pages-081-090:
    needs: pages-071-080
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 81, end_page: 90 }
    secrets: inherit
  pages-091-100:
    needs: pages-081-090
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 91, end_page: 100 }
    secrets: inherit
  pages-101-110:
    needs: pages-091-100
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 101, end_page: 110 }
    secrets: inherit
  pages-111-120:
    needs: pages-101-110
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 111, end_page: 120 }
    secrets: inherit
  pages-121-130:
    needs: pages-111-120
    if: always()
    uses: ./.github/workflows/_backfill-unegui-range.yml
    with: { start_page: 121, end_page: 130 }
    secrets: inherit
