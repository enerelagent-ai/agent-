name: Weekly listing inventory reconciliation

on:
  schedule:
    # Sundays at 04:00 Ulaanbaatar time (UTC+8).
    - cron: "0 20 * * 6"
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper + analytics
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright's browser
        working-directory: scraper
        run: playwright install --with-deps chromium

      - name: Reconcile complete sale and rent inventories
        working-directory: scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m scraper.main --pages 100 --reconcile-inventory
