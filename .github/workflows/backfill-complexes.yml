name: Backfill property complexes

on:
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics package
        run: pip install -e analytics

      - name: Attach reviewed complexes to existing listings
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python analytics/scripts/backfill_complexes.py --dsn "$DATABASE_URL" --apply
