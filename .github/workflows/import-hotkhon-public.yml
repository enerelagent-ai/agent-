name: Import licensed public complex intelligence

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and report without writing to the database"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 22 * * *"

jobs:
  import-public-complexes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics package
        run: pip install -e analytics

      - name: Import robots-allowed public map dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python analytics/scripts/import_hotkhon_public.py
          --database-url "$DATABASE_URL"
          ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Import licensed public affordability snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >-
          python analytics/scripts/import_hotkhon_bolomj_public.py
          --database-url "$DATABASE_URL"
          ${{ inputs.dry_run && '--dry-run' || '' }}
